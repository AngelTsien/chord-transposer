<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>歌词换调</title><style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:16px;background:#111;color:#eee}
textarea{width:100%;height:160px;background:#222;color:#eee;border:1px solid #444;font-family:monospace}
button,select,input{background:#333;color:#eee;border:1px solid #555;padding:6px 10px;margin:4px 2px;border-radius:6px;font-size:15px}
#out{white-space:pre;font-family:"Courier New",monospace;font-size:var(--fs,16px);line-height:1.5;overflow-x:auto;background:#1a1a1a;padding:12px;border-radius:8px}
.c{color:#4fc3f7;font-weight:bold}.bar{position:sticky;top:0;background:#111;padding:6px 0}
</style></head><body>
<h2>🎵 歌词换调</h2>
<input type="file" id="file" accept=".txt,.cho,.chopro,.pro,image/*"> <span id="ocr"></span> <span>或直接粘贴（和弦写在歌词上方，或写成 [C]我爱[G]你）：</span>
<textarea id="src">[C]Twinkle twinkle [F]little [C]star
   G         C
How I wonder what you are</textarea>
<div class="bar">
<button id="down">♭ 降半音</button><b id="key">原调 ±0</b><button id="up">♯ 升半音</button>
<button id="reset">还原</button>
<select id="acc"><option value="auto">自动升降号</option><option value="sharp">用 ♯</option><option value="flat">用 ♭</option></select>
<button id="fm">A-</button><button id="fp">A+</button><button id="dl">下载当前调</button>
</div>
<div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IDX={};S.forEach((n,i)=>IDX[n]=i);F.forEach((n,i)=>IDX[n]=i);Object.assign(IDX,{'E#':5,'B#':0,'Fb':4,'Cb':11});
let shift=0,fs=16;
const NOTE=/([A-G](?:#|b)?)/;
const CHORD=/^[A-G](#|b)?(m|maj|min|dim|aug|sus|add|M)?[0-9]*(?:(?:maj|add|sus|b|#|\+|-)?[0-9]+)*(\([^)]*\))?(\/[A-G](#|b)?)?$/;
function useFlat(){const a=document.getElementById('acc').value;if(a!='auto')return a=='flat';return shift<0}
function tn(n){const i=(IDX[n]+shift+120)%12;return(useFlat()?F:S)[i]}
function tc(c){if(!shift)return c;return c.replace(/^([A-G](?:#|b)?)/,(m)=>tn(m)).replace(/\/([A-G](?:#|b)?)/,(m,n)=>'/'+tn(n))}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function isChordLine(l){const t=l.trim().split(/\s+/).filter(Boolean);return t.length>0&&t.every(x=>CHORD.test(x)||/^[|\-x0-9.]+$/.test(x))}
function render(asText){
  const lines=document.getElementById('src').value.split('\n');
  return lines.map(l=>{
    if(/\[[^\]]+\]/.test(l))return l.replace(/\[([^\]]+)\]/g,(m,c)=>{const t=CHORD.test(c)?tc(c):c;return asText?'['+t+']':'<span class="c">['+esc(t)+']</span>'}).replace(/^(?!.*<span)(.*)$/,m=>asText?m:m);
    if(isChordLine(l)){let out='',re=/\S+/g,m;while((m=re.exec(l))){const t=CHORD.test(m[0])?tc(m[0]):m[0];out+=out.length<m.index?' '.repeat(m.index-out.length):(out.length?' ':'');out+=t}
      return asText?out:'<span class="c">'+esc(out)+'</span>'}
    return asText?l:esc(l)}).join('\n')}
function upd(){document.getElementById('out').innerHTML=render(false);document.getElementById('key').textContent=(shift?'':'原调 ')+(shift>0?'+':shift<0?'':'±')+shift}
document.getElementById('up').onclick=()=>{shift++;upd()};document.getElementById('down').onclick=()=>{shift--;upd()};
document.getElementById('reset').onclick=()=>{shift=0;upd()};document.getElementById('acc').onchange=upd;
document.getElementById('src').oninput=()=>{localStorage.lyr=document.getElementById('src').value;upd()};
document.getElementById('fp').onclick=()=>{fs+=2;document.body.style.setProperty('--fs',fs+'px')};
document.getElementById('fm').onclick=()=>{fs=Math.max(10,fs-2);document.body.style.setProperty('--fs',fs+'px')};
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.type.startsWith('image/')){const st=document.getElementById('ocr');st.textContent='识别中…';Tesseract.recognize(f,'chi_sim+eng',{preserve_interword_spaces:'1',logger:m=>{if(m.progress)st.textContent='识别中 '+Math.round(m.progress*100)+'%'}}).then(r=>{const t=r.data.text.replace(/\n{3,}/g,'\n\n');document.getElementById('src').value=t;localStorage.lyr=t;shift=0;upd();st.textContent='识别完成，请检查和弦后再换调'}).catch(()=>st.textContent='识别失败，请换一张更清楚的图');return}f.text().then(t=>{document.getElementById('src').value=t;localStorage.lyr=t;shift=0;upd()})};
document.getElementById('dl').onclick=()=>{const b=new Blob([render(true)],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lyrics_'+(shift>=0?'+':'')+shift+'.txt';a.click()};
if(localStorage.lyr)document.getElementById('src').value=localStorage.lyr;upd();
</script></body></html>
